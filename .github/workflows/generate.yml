name: Generate Index

on:
  push:
    branches: [master]
    paths:
      - "plugins/**"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 生成 index.json
        run: uv run --frozen python tools/build_index.py
      - name: 提交索引
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 更新插件索引"
          file_pattern: index.json
